name: Documentation

on:
  push:
    branches:
      - docs
  pull_request:
    branches:
      - docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build versioned VitePress documentation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install documentation dependencies
        run: npm install --prefix docs --no-audit --no-fund

      - name: Build complete Pages site
        run: npm run docs:build-site --prefix docs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/docs'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.pages

  deploy:
    name: Deploy VitePress to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/docs'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
