name: Documentation

on:
  push:
    branches: [docs]
  pull_request:
    branches: [docs]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Optional run with a successful checked build of unchanged docs to republish'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

env:
  CUDA_VISIBLE_DEVICES: ''
  MPLBACKEND: Agg
  JULIA_LOAD_PATH: '@:@stdlib'
  JULIA_NUM_THREADS: '1'
  JULIA_PKG_PRECOMPILE_AUTO: '0'

jobs:
  build:
    name: Build checked VitePress dev documentation
    if: ${{ !inputs.artifact_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check deployment recovery and live-site validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Read pinned code commit
        id: version
        shell: bash
        run: |
          node --input-type=module -e '
          import { readFileSync, appendFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("docs/code-version.json", "utf8"));
          if (config.schema_version !== 1 || !/^[0-9a-f]{40}$/.test(config.code_sha)) throw new Error("Invalid code_sha");
          appendFileSync(process.env.GITHUB_OUTPUT, "sha=" + config.code_sha + "\n");'
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.version.outputs.sha }}
          path: _code
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Prepare isolated Julia environment
        run: echo "JULIA_DEPOT_PATH=$RUNNER_TEMP/docs-julia-depot" >> "$GITHUB_ENV"
      - name: Instantiate pinned code dependencies
        shell: julia --startup-file=no --project=_code {0}
        run: |
          using Pkg
          Pkg.instantiate(; allow_autoprecomp=false)
          ENV["PYTHON"] = ""
          Pkg.build("PyCall")
          @assert Base.find_package("Documenter") === nothing
      - name: Install locked website dependencies
        run: npm ci --prefix docs --no-audit --no-fund
      - name: Check tools and CPU examples
        env:
          DOCS_API_MAP: ${{ github.workspace }}/docs/api-map.toml
          DOCS_SITE_PATH: ${{ github.workspace }}/docs
        run: |
          npm run docs:check-tools --prefix docs
          julia --startup-file=no _code/scripts/docs/test_contract_check.jl
          julia --startup-file=no --project=_code _code/scripts/docs/test_export_api.jl
          julia --startup-file=no --project=_code _code/scripts/docs/check_examples.jl
      - name: Build checked dev site
        env:
          DOCS_CODE_PATH: ${{ github.workspace }}/_code
        run: npm run docs:build-site --prefix docs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/docs'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.pages

  recover:
    name: Recover checked Pages artifact
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/docs' && inputs.artifact_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check deployment recovery and live-site validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Recover an unchanged, successfully checked website
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
        run: python3 .github/scripts/recover_pages.py --output "$RUNNER_TEMP/recovered-pages"
      - name: Upload recovered Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/recovered-pages

  deploy:
    name: Deploy VitePress to GitHub Pages
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/docs' && (needs.build.result == 'success' || needs.recover.result == 'success') }}
    needs: [build, recover]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published code revision and pages
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 .github/scripts/check_live_pages.py
