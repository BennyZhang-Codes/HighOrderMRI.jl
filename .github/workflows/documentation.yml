name: API documentation checks

on:
  push:
    branches: [main, dev_jinyuan]
  pull_request:
    branches: [main, dev_jinyuan]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ''
  MPLBACKEND: Agg
  JULIA_LOAD_PATH: '@:@stdlib'
  JULIA_NUM_THREADS: '1'
  JULIA_PKG_PRECOMPILE_AUTO: '0'

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: docs
          path: _website
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Prepare isolated Julia environment
        shell: bash
        run: |
          echo "JULIA_DEPOT_PATH=$RUNNER_TEMP/docs-julia-depot" >> "$GITHUB_ENV"
      - name: Instantiate package dependencies
        shell: julia --startup-file=no --project=. {0}
        run: |
          using Pkg
          Pkg.instantiate(; allow_autoprecomp=false)
          ENV["PYTHON"] = ""
          Pkg.build("PyCall")
          @assert Base.find_package("Documenter") === nothing
      - name: Record website snapshot
        run: git -C _website rev-parse HEAD
      - name: Check contracts and generator
        env:
          DOCS_API_MAP: ${{ github.workspace }}/_website/docs/api-map.toml
        run: |
          julia --startup-file=no scripts/docs/test_contract_check.jl
          julia --startup-file=no --project=. scripts/docs/test_export_api.jl
      - name: Generate all mapped interfaces
        run: >-
          julia --startup-file=no --project=. scripts/docs/export_api.jl
          --map _website/docs/api-map.toml --output "$RUNNER_TEMP/api-reference"
          --code-root "$GITHUB_WORKSPACE" --code-sha "$(git rev-parse HEAD)" --mode preview
      - name: Run CPU documentation examples
        env:
          DOCS_SITE_PATH: ${{ github.workspace }}/_website/docs
        run: julia --startup-file=no --project=. scripts/docs/check_examples.jl

  publish:
    name: Synchronize and publish documentation versions
    needs: docs
    if: >-
      github.repository == 'BennyZhang-Codes/HighOrderMRI.jl' &&
      ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
       (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev_jinyuan') ||
       github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    concurrency:
      group: documentation-version-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs
          fetch-depth: 0
      - name: Check version synchronization and publication
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Pin current branches and formal releases, then build docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/sync_versions.py
