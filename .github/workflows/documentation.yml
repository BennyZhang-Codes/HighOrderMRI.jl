name: Documentation

on:
  push:
    branches: [docs]
  pull_request:
    branches: [docs]
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Optional run with a successful checked build of unchanged docs to republish'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: documentation-pages
  cancel-in-progress: false

env:
  CUDA_VISIBLE_DEVICES: ''
  MPLBACKEND: Agg
  JULIA_LOAD_PATH: '@:@stdlib'
  JULIA_NUM_THREADS: '1'
  JULIA_PKG_PRECOMPILE_AUTO: '0'

jobs:
  build:
    name: Build checked VitePress versions
    if: ${{ !inputs.artifact_run_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check deployment recovery and live-site validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Validate version sources
        env:
          GH_TOKEN: ${{ github.token }}
          DOCS_CANDIDATE: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$DOCS_CANDIDATE" = true ]; then
            python3 .github/scripts/verify_releases.py --allow-unpublished
          else
            python3 .github/scripts/verify_releases.py
          fi
      - name: Prepare pinned code checkouts
        run: |
          node docs/scripts/versions.mjs docs --code-shas > "$RUNNER_TEMP/docs-code-shas"
          mkdir -p "$RUNNER_TEMP/docs-code"
          while IFS= read -r code_sha; do
            git worktree add --detach "$RUNNER_TEMP/docs-code/$code_sha" "$code_sha"
          done < "$RUNNER_TEMP/docs-code-shas"
          echo "DOCS_CODE_ROOT=$RUNNER_TEMP/docs-code" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - name: Prepare isolated Julia environment
        run: echo "JULIA_DEPOT_PATH=$RUNNER_TEMP/docs-julia-depot" >> "$GITHUB_ENV"
      - name: Instantiate pinned code dependencies
        run: |
          while IFS= read -r code_sha; do
            julia --startup-file=no --project="$DOCS_CODE_ROOT/$code_sha" -e '
              using Pkg
              Pkg.instantiate(; allow_autoprecomp=false)
              ENV["PYTHON"] = ""
              Pkg.build("PyCall")
              @assert Base.find_package("Documenter") === nothing'
          done < "$RUNNER_TEMP/docs-code-shas"
      - name: Install locked website dependencies
        run: npm ci --prefix docs --no-audit --no-fund
      - name: Check website tools
        run: npm run docs:check-tools --prefix docs
      - name: Build all checked versions and CPU examples
        env:
          DOCS_CHECK_EXAMPLES: '1'
          DOCS_CANDIDATE: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$DOCS_CANDIDATE" = true ]; then
            npm run docs:build-site --prefix docs -- --preview
          else
            npm run docs:build-site --prefix docs
          fi
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/docs'
        uses: actions/upload-pages-artifact@v4
        with:
          name: checked-documentation-site
          path: docs/.pages

  recover:
    name: Recover checked Pages artifact
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/docs' && inputs.artifact_run_id != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check deployment recovery and live-site validation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Recover an unchanged, successfully checked website
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.artifact_run_id }}
        run: python3 .github/scripts/recover_pages.py --output "$RUNNER_TEMP/recovered-pages"
      - name: Upload recovered Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: checked-documentation-site
          path: ${{ runner.temp }}/recovered-pages

  deploy:
    name: Deploy VitePress to GitHub Pages
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/docs' && (needs.build.result == 'success' || needs.recover.result == 'success') }}
    needs: [build, recover]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download the checked complete site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: checked-documentation-site
          path: ${{ runner.temp }}/checked-pages-artifact
      - name: Update the generated gh-pages archive
        id: archive
        run: >-
          python3 .github/scripts/archive_pages.py
          --artifact-tar "$RUNNER_TEMP/checked-pages-artifact/artifact.tar"
          --site "$RUNNER_TEMP/checked-pages-site"
          --source-sha "$GITHUB_SHA"
      - name: Prepare the archived Pages tree
        if: steps.archive.outputs.publish == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/archived-pages-site"
          git archive '${{ steps.archive.outputs.sha }}' | tar -xf - -C "$RUNNER_TEMP/archived-pages-site"
      - name: Upload the archived Pages artifact
        if: steps.archive.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/archived-pages-site
      - name: Configure GitHub Pages
        if: steps.archive.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Deploy Pages artifact
        if: steps.archive.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published code revision and pages
        if: steps.archive.outputs.publish == 'true'
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 .github/scripts/check_live_pages.py
